name: Validate DOAIA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned tooling
        run: npm ci
      - name: Lint OpenAPI contract
        run: npx redocly lint openapi/openapi.yaml
      - name: Bundle OpenAPI (confirms all references resolve)
        run: npx redocly bundle openapi/openapi.yaml -o "$RUNNER_TEMP/doaia-bundled.yaml"

  docs:
    name: Validate Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned tooling
        run: npm ci
      - name: Validate pages, navigation and OpenAPI reference
        run: npx mint validate
      - name: Check internal links
        run: npx mint broken-links
